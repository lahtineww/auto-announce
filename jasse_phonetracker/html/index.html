<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puhelinträkkeri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="window">

            <!-- ── Header ──────────────────────────────────────────── -->
            <div class="header">
                <div class="header-brand" id="lBrand">Poliisi</div>

                <div class="tab-strip">
                    <div class="tab active">
                        <span class="tab-label" id="lTabTitle"></span>
                        <button class="tab-x" id="btnClose">&#10005;</button>
                    </div>
                    <button class="tab-add">+</button>
                </div>

                <div class="officer-block">
                    <div class="officer-text">
                        <div class="officer-name" id="officerName"></div>
                        <div class="officer-time" id="liveTime"></div>
                    </div>
                    <div class="officer-avatar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- ── Body ────────────────────────────────────────────── -->
            <div class="body">

                <!-- Left nav sidebar — only items with real functionality -->
                <div class="sidebar">
                    <div class="nav-item active" id="navMain" onclick="switchView('main')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 9.7 19.79 19.79 0 0 1 1.61 1.1a2 2 0 0 1 1.99-2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 6.5a16 16 0 0 0 6 6l.94-.94a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 13.92z"/>
                        </svg>
                        <span id="lNavMain"></span>
                    </div>
                    <div class="nav-item" id="navHistory" onclick="switchView('history')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span id="lNavHistory"></span>
                    </div>
                </div>

                <!-- ── View: Seuranta (main 3-column) ──────────────── -->
                <div id="viewMain" class="columns">

                    <!-- Column 1: Search -->
                    <div class="column">
                        <div class="col-header" id="lColSearch"></div>
                        <div class="col-body" id="searchBody">
                            <div class="empty-state" id="searchHint"></div>
                        </div>
                        <div class="col-footer">
                            <input
                                type="text"
                                id="phoneInput"
                                class="col-input"
                                maxlength="20"
                                autocomplete="off"
                            >
                            <button class="col-send" id="btnTrack">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Column 2: Active tracks -->
                    <div class="column">
                        <div class="col-header">
                            <span id="lColTracks"></span>
                            <span class="count-badge" id="trackCount">0</span>
                        </div>
                        <div class="col-body scroll" id="trackList">
                            <div class="empty-state" id="lNoTracks"></div>
                        </div>
                    </div>

                    <!-- Column 3: Cooldowns -->
                    <div class="column">
                        <div class="col-header" id="lColCooldowns"></div>
                        <div class="col-body scroll" id="cooldownList">
                            <div class="empty-state" id="lNoCooldowns"></div>
                        </div>
                    </div>

                </div>

                <!-- ── View: Historia ───────────────────────────────── -->
                <div id="viewHistory" class="view-single hidden">
                    <div class="col-header" id="lHistoryTitle"></div>
                    <div class="col-body scroll" id="historyList">
                        <div class="empty-state" id="lNoHistory"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
